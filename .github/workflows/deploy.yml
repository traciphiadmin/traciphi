name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Prepare GitHub Pages artifact (debug)
        run: |
          set -euxo pipefail
          echo "Current directory:"
          pwd   
          echo "Full dist structure:"
          find dist -maxdepth 3 -type f | sort || true
          mkdir -p gh-pages
          echo "Copying files..."
          cp -rv dist/client/. gh-pages/
          echo "Final gh-pages structure:"
          find gh-pages -maxdepth 2 -type f | sort
            - uses: actions/upload-pages-artifact@v3
              with:
                path: gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
